name: Daily Executive Brief

on:
  schedule:
    # 22:30 UTC hari Minggu-Kamis = 05:30 WIB hari Senin-Jumat
    - cron: '30 22 * * 0-4'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-executive-brief
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: cd daily-brief && npm install --no-fund --no-audit

      - name: Syntax check
        run: cd daily-brief && node --check generate.mjs

      - name: Generate brief
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BRIEF_MODEL: ${{ vars.BRIEF_MODEL || 'deepseek-v4-flash' }}
          BRIEF_MAX_TOKENS: ${{ vars.BRIEF_MAX_TOKENS || '24000' }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-1' }}
          OPENAI_IMAGE_SIZE: ${{ vars.OPENAI_IMAGE_SIZE || '1536x1024' }}
          OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY || 'high' }}
        run: cd daily-brief && node generate.mjs

      - name: Validate published files
        run: |
          set -euo pipefail
          today="$(TZ=Asia/Jakarta date +%F)"
          test -f "briefs/${today}.html"
          test -f "briefs/manifest.json"
          test -f "index.html"
          test -f "sitemap.xml"
          test -f "robots.txt"
          TODAY="$today" node -e "const fs=require('fs'); const d=process.env.TODAY; const m=JSON.parse(fs.readFileSync('briefs/manifest.json','utf8')); if (!m[d] || m[d].file !== d + '.html') throw new Error('manifest missing today: ' + d); const home=fs.readFileSync('index.html','utf8'); if (!home.includes('./briefs/' + d + '.html')) throw new Error('homepage latest link is stale: ' + d); if (!home.includes('rel=\"canonical\" href=\"https://leaderbrief.id/\"')) throw new Error('homepage canonical missing'); const sitemap=fs.readFileSync('sitemap.xml','utf8'); if (!sitemap.includes('https://leaderbrief.id/briefs/' + d + '.html')) throw new Error('sitemap missing today: ' + d); const robots=fs.readFileSync('robots.txt','utf8'); if (!robots.includes('Sitemap: https://leaderbrief.id/sitemap.xml')) throw new Error('robots missing sitemap'); const article=fs.readFileSync('briefs/' + d + '.html','utf8'); if (!article.includes('rel=\"canonical\" href=\"https://leaderbrief.id/briefs/' + d + '.html\"')) throw new Error('article canonical missing: ' + d); if (!/<\\/body>\\s*<\\/html>\\s*$/i.test(article)) throw new Error('article incomplete: missing closing body/html'); if (/<\\s*$/.test(article) || /<[^>]{0,80}$/.test(article)) throw new Error('article incomplete: ends inside tag'); if ((article.match(/<article\\b/gi)||[]).length !== (article.match(/<\\/article>/gi)||[]).length) throw new Error('article incomplete: unbalanced article tags'); if ((article.match(/<div\\b/gi)||[]).length !== (article.match(/<\\/div>/gi)||[]).length) throw new Error('article incomplete: unbalanced div tags');"

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "daily brief $(date -u +%F)"
            git push
          fi
