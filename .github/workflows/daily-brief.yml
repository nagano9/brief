name: Daily Executive Brief

on:
  schedule:
    # 22:30 UTC hari Minggu-Kamis = 05:30 WIB hari Senin-Jumat
    - cron: '30 22 * * 0-4'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-executive-brief
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: cd daily-brief && npm install --no-fund --no-audit

      - name: Syntax check
        run: cd daily-brief && node --check generate.mjs

      - name: Generate brief
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: cd daily-brief && node generate.mjs

      - name: Validate published files
        run: |
          set -euo pipefail
          today="$(TZ=Asia/Jakarta date +%F)"
          test -f "briefs/${today}.html"
          test -f "briefs/manifest.json"
          test -f "index.html"
          TODAY="$today" node -e "const fs=require('fs'); const d=process.env.TODAY; const m=JSON.parse(fs.readFileSync('briefs/manifest.json','utf8')); if (!m[d] || m[d].file !== d + '.html') throw new Error('manifest missing today: ' + d); const home=fs.readFileSync('index.html','utf8'); if (!home.includes('./briefs/' + d + '.html')) throw new Error('homepage latest link is stale: ' + d);"

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "daily brief $(date -u +%F)"
            git push
          fi
