name: Scheduled Content

on:
  schedule:
    # Setiap jam (UTC). Template di config.json memakai zona Asia/Jakarta (WIB).
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      template:
        description: 'Template id untuk digenerate sekarang (kosongkan = tick normal)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Generate due content (tick)
        if: ${{ inputs.template == '' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node src/run.js

      - name: Generate one template now
        if: ${{ inputs.template != '' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node src/run.js --now "${{ inputs.template }}"

      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: scheduled content run"
            git push
          fi
